name: Build AML 64-bit Plugin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Official AML SDK Headers
        run: |
          git clone --depth=1 "https://github.com/RusJJ/AndroidModLoader.git" /tmp/aml_template
          if [ -d "/tmp/aml_template/template_of_mod/mod" ]; then
            cp -r /tmp/aml_template/template_of_mod/mod ./jni/
          elif [ -d "/tmp/aml_template/template_of_mod/jni/mod" ]; then
            cp -r /tmp/aml_template/template_of_mod/jni/mod ./jni/
          elif [ -d "/tmp/aml_template/mod" ]; then
            cp -r /tmp/aml_template/mod ./jni/
          else
            echo "Error: Mod headers folder not found in repository!" && exit 1
          fi

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Compile arm64-v8a Binary
        run: |
          ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./jni/Android.mk NDK_APPLICATION_MK=./jni/Application.mk -j$(nproc)

      - name: Upload Compiled .so Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libManualDrivebySA-arm64-v8a
          path: libs/arm64-v8a/libManualDrivebySA.so
          if-no-files-found: error
