name: Build AML 64-bit Plugin

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch AML 1.4.0 SDK Headers
        run: |
          mkdir -p jni/include/mod
          # Clone official AndroidModLoader repository
          git clone --depth 1 https://github.com/RusJJ/AndroidModLoader.git /tmp/aml
          
          # Copy headers to jni/include/mod/ so <mod/amlmod.h> resolves properly
          if [ -d "/tmp/aml/mod" ]; then
            cp -rf /tmp/aml/mod/*.h jni/include/mod/ || true
          fi
          if [ -d "/tmp/aml/include" ]; then
            cp -rf /tmp/aml/include/* jni/include/ || true
          fi

          # Verify amlmod.h exists
          if [ ! -f "jni/include/mod/amlmod.h" ]; then
            echo "Failed to locate amlmod.h from repository structure, searching..."
            find /tmp/aml -name "amlmod.h" -exec dirname {} \; | head -n 1 | xargs -I {} cp -rf {}/*.h jni/include/mod/
          fi
          
          ls -la jni/include/mod/

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Build 64-bit .so with ndk-build
        run: |
          cd jni
          ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./Android.mk NDK_APPLICATION_MK=./Application.mk -j$(nproc)

      - name: Upload Compiled .so Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ManualDrivebyRefixed-ARM64
          path: jni/libs/arm64-v8a/libManualDriveby.so
          if-no-files-found: error
