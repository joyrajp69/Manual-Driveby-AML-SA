name: Build AML 64-bit Plugin

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch AML 1.4.0 SDK Headers
        run: |
          mkdir -p jni/include/mod
          git clone --depth 1 https://github.com/RusJJ/AndroidModLoader.git /tmp/aml
          cp -r /tmp/aml/include/* jni/include/ || cp -r /tmp/aml/mod/* jni/include/mod/ || true
          # Fallback to AML template headers if layout differs
          if [ ! -f "jni/include/mod/amlmod.h" ]; then
            git clone --depth 1 https://github.com/AndroidModLoader/GTASA_CLEO_AudioStreams.git /tmp/aml_tpl
            cp -r /tmp/aml_tpl/include/mod/* jni/include/mod/
          fi

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Build 64-bit .so with ndk-build
        working-directory: jni
        run: |
          ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./Android.mk NDK_APPLICATION_MK=./Application.mk -j$(nproc)

      - name: Upload Compiled .so Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ManualDrivebyRefixed-ARM64
          path: libs/arm64-v8a/libManualDriveby.so
          if-no-files-found: error
