name: Build AML 64-bit Plugin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Official AML SDK Headers & Sources
        run: |
          git clone --depth=1 "https://github.com/RusJJ/AndroidModLoader.git" /tmp/aml_repo
          mkdir -p ./jni/mod
          if [ -d "/tmp/aml_repo/template_of_mod/mod" ]; then
            cp -r /tmp/aml_repo/template_of_mod/mod/* ./jni/mod/
          elif [ -d "/tmp/aml_repo/include/mod" ]; then
            cp -r /tmp/aml_repo/include/mod/* ./jni/mod/
            cp /tmp/aml_repo/mod/*.cpp ./jni/mod/ 2>/dev/null || true
          elif [ -d "/tmp/aml_repo/mod" ]; then
            cp -r /tmp/aml_repo/mod/* ./jni/mod/
          fi
          ls -la ./jni/mod/

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Compile arm64-v8a Binary
        run: |
          ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./jni/Android.mk NDK_APPLICATION_MK=./jni/Application.mk -j$(nproc)

      - name: Upload Compiled .so Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libManualDrivebySA-arm64-v8a
          path: libs/arm64-v8a/libManualDrivebySA.so
          if-no-files-found: error

